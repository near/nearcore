name: CI

#cspell:ignore SCCACHE endgroup etime ppid

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  merge_group:

env:
  CI_HACKS: 1
  # Pinned so that sccache-action does not look up the latest release through
  # the GitHub API, a request it does not retry. Bump it together with the Rust
  # toolchain in rust-toolchain.toml, since both can invalidate the cache.
  SCCACHE_VERSION: v0.20.1
  # Start the sccache server without probing the GCS bucket. The probe must
  # finish within sccache's 10 s server startup timeout, otherwise the first
  # rustc call fails, whereas cache errors during the build only fall back to
  # compiling locally.
  SCCACHE_SKIP_CACHE_CHECK: 1

# BE CAREFUL IF EDITING THIS FILE:
# If you add/remove python tests from here, you should also update `check_pytests.py`’s list of GHA_TESTS
# so that it stays in-sync, to make sure no tests are lost.

jobs:
  cargo_nextest:
    name: "Cargo Nextest (${{matrix.name}})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            id: linux
            os: warp-ubuntu-2404-x64-16x
            type: stable
            run_on_pr: true
          # TODO(spice): Once the feature is close to release make it part of nightly.
          - name: Linux Spice
            id: linux-spice
            os: warp-ubuntu-2404-x64-16x
            type: spice
            run_on_pr: true
          - name: Linux Nightly
            id: linux-nightly
            os: warp-ubuntu-2404-x64-16x
            type: nightly
            run_on_pr: true
          - name: MacOS
            id: macos
            os: warp-macos-latest-arm64-6x
            type: stable
            run_on_pr: false
    timeout-minutes: 90
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - if: github.event_name != 'pull_request' || matrix.run_on_pr
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

        with:
          persist-credentials: false

      - if: github.event_name != 'pull_request' || matrix.run_on_pr
        id: gcp-auth
        name: Authenticate with Google Cloud
        continue-on-error: true
        uses: "google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed" # v2.1.13
        with:
          workload_identity_provider: "projects/60246494556/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "sccache-sa@nearone-services.iam.gserviceaccount.com"
      - if: (github.event_name != 'pull_request' || matrix.run_on_pr) && steps.gcp-auth.outcome == 'success'
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
        with:
          version: ${{ env.SCCACHE_VERSION }}
      - if: (github.event_name != 'pull_request' || matrix.run_on_pr) && steps.gcp-auth.outcome == 'success'
        run: |
          echo "SCCACHE_GCS_BUCKET=nearone-sccache" >> $GITHUB_ENV
          echo "SCCACHE_GCS_RW_MODE=READ_WRITE" >> $GITHUB_ENV
          echo "SCCACHE_GCS_KEY_PREFIX=nearcore/ci" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      # Install all the required tools
      - if: github.event_name != 'pull_request' || matrix.run_on_pr
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just,cargo-nextest,cargo-llvm-cov

      - if: github.event_name != 'pull_request' || matrix.run_on_pr
        uses: ./.github/actions/install-clang

      # Run the tests
      - name: just nextest-slow ${{ matrix.type }} (with coverage)
        if: (github.event_name != 'pull_request' || matrix.run_on_pr)
        # The slowest healthy run of this step takes ~31 minutes (macOS). Fail
        # before the merge queue's 60 minute limit removes the whole group.
        timeout-minutes: 45
        run: |
          mkdir -p coverage/codecov
          # If the step is still running after 35 minutes it is most likely
          # stuck. Dump the process tree, and on macOS the stacks of the test
          # processes, before the timeout above kills everything.
          (
            sleep 2100
            echo "::group::Still running after 35 minutes, process list"
            ps -axo pid,ppid,etime,stat,command
            echo "::endgroup::"
            if command -v sample > /dev/null; then
              for pid in $(pgrep -f "$PWD/target/" | head -n 8); do
                echo "::group::sample $pid"
                sample "$pid" 3 2>&1 | head -n 400
                echo "::endgroup::"
              done
            fi
          ) &
          watchdog=$!
          just codecov-ci "nextest-slow ${{ matrix.type }}"
          pkill -P "$watchdog" || true
          kill "$watchdog" || true

      # Upload the coverage files
      - if: github.event_name != 'pull_request' || matrix.run_on_pr
        run: mv coverage/codecov/{new,unit-${{matrix.id}}}.json
      - if: github.event_name != 'pull_request' || matrix.run_on_pr
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-codecov-${{ github.sha }}-cargo_nextest-${{ matrix.name }}
          path: coverage/codecov

  protobuf_backward_compat:
    name: "Protobuf Backward Compatibility"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: 1.72.0
          # The action enables these on pull_request events only. Set them
          # explicitly so they also run on merge_group.
          lint: true
          format: true
          breaking: true
          breaking_against: "https://github.com/near/nearcore.git#${{github.event.pull_request.base.sha && format('ref={0}', github.event.pull_request.base.sha) || 'branch=master' }}"
          pr_comment: false

  pytest_nightly_tests:
    name: "Large pytest (nightly) Checks"
    runs-on: warp-ubuntu-2404-x64-16x
    strategy:
      fail-fast: false
    timeout-minutes: 90
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: gcp-auth
        name: Authenticate with Google Cloud
        continue-on-error: true
        uses: "google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed" # v2.1.13
        with:
          workload_identity_provider: "projects/60246494556/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "sccache-sa@nearone-services.iam.gserviceaccount.com"
      - if: steps.gcp-auth.outcome == 'success'
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
        with:
          version: ${{ env.SCCACHE_VERSION }}
      - if: steps.gcp-auth.outcome == 'success'
        run: |
          echo "SCCACHE_GCS_BUCKET=nearone-sccache" >> $GITHUB_ENV
          echo "SCCACHE_GCS_RW_MODE=READ_WRITE" >> $GITHUB_ENV
          echo "SCCACHE_GCS_KEY_PREFIX=nearcore/ci" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
      - uses: WarpBuilds/setup-python@6cfa838faedb1152a7dc8626f00fdc041d8ebd82 # v5.1.4
        with:
          python-version: 3.11
          cache: pip
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov
      - run: pip3 install --user -r pytest/requirements.txt
      # This is the only job that uses `--features nightly` so we build this in-line instead of a
      # separate job like done with the regular neard.
      - run: cargo llvm-cov show-env --no-rustc-wrapper | grep -v RUSTFLAGS | tr -d "'" >> "$GITHUB_ENV"
      - run: echo "RUSTC_WORKSPACE_WRAPPER=$PWD/scripts/coverage-wrapper-rustc" >> "$GITHUB_ENV"
      - run: echo "CARGO=1" >> "$GITHUB_ENV"
      - uses: ./.github/actions/install-clang
      - run: cargo build --profile dev-release -p neard --bin neard --features nightly
      # Note: We're not running spin_up_cluster.py for non-nightly
      # because spinning up non-nightly clusters is already covered
      # by other steps in the CI, e.g. upgradable.
      - run: python3 pytest/tests/sanity/spin_up_cluster.py
        env:
          NEAR_ROOT: "target/dev-release"
      - run: mkdir -p coverage/codecov
      - run: cargo llvm-cov report --profile dev-release --codecov --output-path coverage/codecov/py-nightly.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-codecov-${{ github.sha }}-py-nightly
          path: coverage/codecov

  protocol_schema_check:
    name: "Protocol Schema"
    runs-on: warp-ubuntu-2404-x64-8x
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: gcp-auth
        name: Authenticate with Google Cloud
        continue-on-error: true
        uses: "google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed" # v2.1.13
        with:
          workload_identity_provider: "projects/60246494556/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "sccache-sa@nearone-services.iam.gserviceaccount.com"
      - if: steps.gcp-auth.outcome == 'success'
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
        with:
          version: ${{ env.SCCACHE_VERSION }}
      - if: steps.gcp-auth.outcome == 'success'
        run: |
          echo "SCCACHE_GCS_BUCKET=nearone-sccache" >> $GITHUB_ENV
          echo "SCCACHE_GCS_RW_MODE=READ_WRITE" >> $GITHUB_ENV
          echo "SCCACHE_GCS_KEY_PREFIX=nearcore/ci" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - uses: taiki-e/install-action@e797ba6a25dbd8669057e123b02812e16138589e
        with:
          tool: just
      - uses: ./.github/actions/install-clang
      - run: just check-protocol-schema

  py_style_check:
    name: "Style"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e797ba6a25dbd8669057e123b02812e16138589e
        with:
          tool: just
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11
          cache: pip
      - run: pip3 install --user -r pytest/requirements.txt
      - run: just python-style-checks

  check_fmt:
    name: "Cargo Fmt"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e797ba6a25dbd8669057e123b02812e16138589e
        with:
          tool: just
      - run: just check-cargo-fmt

  check_import_blocks:
    name: "Import Blocks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e797ba6a25dbd8669057e123b02812e16138589e
        with:
          tool: just
      - run: just check-import-blocks

  check_clippy:
    name: "Cargo Clippy"
    runs-on: warp-ubuntu-2404-x64-8x
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: gcp-auth
        name: Authenticate with Google Cloud
        continue-on-error: true
        uses: "google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed" # v2.1.13
        with:
          workload_identity_provider: "projects/60246494556/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "sccache-sa@nearone-services.iam.gserviceaccount.com"
      - if: steps.gcp-auth.outcome == 'success'
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
        with:
          version: ${{ env.SCCACHE_VERSION }}
      - if: steps.gcp-auth.outcome == 'success'
        run: |
          echo "SCCACHE_GCS_BUCKET=nearone-sccache" >> $GITHUB_ENV
          echo "SCCACHE_GCS_RW_MODE=READ_WRITE" >> $GITHUB_ENV
          echo "SCCACHE_GCS_KEY_PREFIX=nearcore/ci" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
      - uses: taiki-e/install-action@e797ba6a25dbd8669057e123b02812e16138589e
        with:
          tool: just
      - uses: ./.github/actions/install-clang
      - run: just check-cargo-clippy

  doctests:
    name: "Rust Doctests"
    runs-on: warp-ubuntu-2404-x64-8x
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: gcp-auth
        name: Authenticate with Google Cloud
        continue-on-error: true
        uses: "google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed" # v2.1.13
        with:
          workload_identity_provider: "projects/60246494556/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "sccache-sa@nearone-services.iam.gserviceaccount.com"
      - if: steps.gcp-auth.outcome == 'success'
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
        with:
          version: ${{ env.SCCACHE_VERSION }}
      - if: steps.gcp-auth.outcome == 'success'
        run: |
          echo "SCCACHE_GCS_BUCKET=nearone-sccache" >> $GITHUB_ENV
          echo "SCCACHE_GCS_RW_MODE=READ_WRITE" >> $GITHUB_ENV
          echo "SCCACHE_GCS_KEY_PREFIX=nearcore/ci" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
      - uses: taiki-e/install-action@e797ba6a25dbd8669057e123b02812e16138589e
        with:
          tool: just
      - uses: ./.github/actions/install-clang
      - run: just doctests

  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e797ba6a25dbd8669057e123b02812e16138589e
        with:
          tool: just
      - run: npm install -g cspell
      - run: just check-cspell

  check_zizmor:
    name: "Zizmor (GitHub Actions security)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just,zizmor@1.32.0
      - run: just check-zizmor
        env:
          GH_TOKEN: ${{ github.token }}

  check_cargo_deny:
    name: "Cargo Deny"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e797ba6a25dbd8669057e123b02812e16138589e
        with:
          tool: just,cargo-deny
      - run: just check-cargo-deny

  check_themis:
    name: "Themis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e797ba6a25dbd8669057e123b02812e16138589e
        with:
          tool: just
      - run: just check-themis

  check_machete:
    name: "Cargo machete (unused dependencies)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e797ba6a25dbd8669057e123b02812e16138589e
        with:
          tool: just,cargo-machete
      - run: just check-cargo-machete

  check_non_default:
    name: "Non-default Configuration Builds"
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: gcp-auth
        name: Authenticate with Google Cloud
        continue-on-error: true
        uses: "google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed" # v2.1.13
        with:
          workload_identity_provider: "projects/60246494556/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "sccache-sa@nearone-services.iam.gserviceaccount.com"
      - if: steps.gcp-auth.outcome == 'success'
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
        with:
          version: ${{ env.SCCACHE_VERSION }}
      - if: steps.gcp-auth.outcome == 'success'
        run: |
          echo "SCCACHE_GCS_BUCKET=nearone-sccache" >> $GITHUB_ENV
          echo "SCCACHE_GCS_RW_MODE=READ_WRITE" >> $GITHUB_ENV
          echo "SCCACHE_GCS_KEY_PREFIX=nearcore/ci" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
      - uses: taiki-e/install-action@e797ba6a25dbd8669057e123b02812e16138589e
        with:
          tool: just
      - run: just check-non-default

  check_nearcore_no_default_features:
    name: "Non-default Configuration Builds (nearcore crate)"
    runs-on: warp-ubuntu-2404-x64-8x
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: gcp-auth
        name: Authenticate with Google Cloud
        continue-on-error: true
        uses: "google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed" # v2.1.13
        with:
          workload_identity_provider: "projects/60246494556/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "sccache-sa@nearone-services.iam.gserviceaccount.com"
      - if: steps.gcp-auth.outcome == 'success'
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
        with:
          version: ${{ env.SCCACHE_VERSION }}
      - if: steps.gcp-auth.outcome == 'success'
        run: |
          echo "SCCACHE_GCS_BUCKET=nearone-sccache" >> $GITHUB_ENV
          echo "SCCACHE_GCS_RW_MODE=READ_WRITE" >> $GITHUB_ENV
          echo "SCCACHE_GCS_KEY_PREFIX=nearcore/ci" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
      - uses: taiki-e/install-action@e797ba6a25dbd8669057e123b02812e16138589e
        with:
          tool: just
      - uses: ./.github/actions/install-clang
      - run: just check-nearcore-no-default-features

  check_udeps:
    name: "Unused Dependencies"
    runs-on: warp-ubuntu-2404-x64-8x
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: gcp-auth
        name: Authenticate with Google Cloud
        continue-on-error: true
        uses: "google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed" # v2.1.13
        with:
          workload_identity_provider: "projects/60246494556/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "sccache-sa@nearone-services.iam.gserviceaccount.com"
      - if: steps.gcp-auth.outcome == 'success'
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
        with:
          version: ${{ env.SCCACHE_VERSION }}
      - if: steps.gcp-auth.outcome == 'success'
        run: |
          echo "SCCACHE_GCS_BUCKET=nearone-sccache" >> $GITHUB_ENV
          echo "SCCACHE_GCS_RW_MODE=READ_WRITE" >> $GITHUB_ENV
          echo "SCCACHE_GCS_KEY_PREFIX=nearcore/ci" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
      - uses: taiki-e/install-action@e797ba6a25dbd8669057e123b02812e16138589e
        with:
          tool: just,cargo-udeps
      - uses: ./.github/actions/install-clang
      - run: just check-cargo-udeps

  cargo_audit:
    name: "Cargo Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e797ba6a25dbd8669057e123b02812e16138589e
        with:
          tool: cargo-audit
      - run: cargo audit -D warnings

  upload_coverage:
    name: "Upload Coverage"
    runs-on: ubuntu-latest
    needs:
      - cargo_nextest
      - pytest_nightly_tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-codecov-*
          merge-multiple: true
      # Keep the number of uploads here in sync with codecov.yml’s after_n_build value
      # codecov will send a comment only after having received this number of uploads.
      - uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7
        with:
          files: unit-linux.json
          fail_ci_if_error: false
          flags: unittests
      - uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7
        with:
          files: unit-linux-nightly.json
          fail_ci_if_error: false
          flags: unittests-nightly
      - uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7
        with:
          files: unit-linux-spice.json
          fail_ci_if_error: false
          flags: unittests-spice
      - uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7
        with:
          files: py-nightly.json
          fail_ci_if_error: false
          flags: pytests-nightly

  publishable_packages_check:
    name: "Cargo check publishable packages separately (${{ matrix.name }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            id: linux
            os: warp-ubuntu-2404-x64-8x
          - name: Windows
            id: win
            os: windows-latest
    timeout-minutes: 30
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      # We use this step to indicate when the whole job needs to be skipped.
      # We don't use job-level condition so that matrix.name in the name is pretty-expended even when the job is skipped.
      - id: run-job
        if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
        name: Check if job should be skipped
        run: true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.run-job.outcome == 'success'
        with:
          persist-credentials: false
      - id: gcp-auth
        if: steps.run-job.outcome == 'success'
        name: Authenticate with Google Cloud
        continue-on-error: true
        uses: "google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed" # v2.1.13
        with:
          workload_identity_provider: "projects/60246494556/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "sccache-sa@nearone-services.iam.gserviceaccount.com"
      - if: steps.run-job.outcome == 'success' && steps.gcp-auth.outcome == 'success'
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
        with:
          version: ${{ env.SCCACHE_VERSION }}
      - if: steps.run-job.outcome == 'success' && steps.gcp-auth.outcome == 'success'
        # The default shell on Windows is PowerShell, where `$GITHUB_ENV` is an
        # unset variable and the writes below are silently discarded.
        shell: bash
        run: |
          echo "SCCACHE_GCS_BUCKET=nearone-sccache" >> $GITHUB_ENV
          echo "SCCACHE_GCS_RW_MODE=READ_WRITE" >> $GITHUB_ENV
          echo "SCCACHE_GCS_KEY_PREFIX=nearcore/ci" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          # sccache spawns rustc with all arguments on the command line, which
          # for near-runtime exceeds the Windows limit of 32767 characters
          # (os error 206). Most of the length is repeated target directory
          # paths, so use a short one at the root of the workspace drive.
          if [ "$RUNNER_OS" == "Windows" ]; then
            echo "CARGO_TARGET_DIR=${GITHUB_WORKSPACE:0:2}\\t" >> $GITHUB_ENV
          fi
      # near-store (with its default `rocksdb` feature) builds librocksdb-sys.
      - uses: ./.github/actions/install-clang
        if: steps.run-job.outcome == 'success'
      - uses: taiki-e/install-action@e797ba6a25dbd8669057e123b02812e16138589e
        if: steps.run-job.outcome == 'success'
        with:
          tool: just
      - if: steps.run-job.outcome == 'success'
        run: just check-publishable-separately
      - if: steps.run-job.outcome == 'success'
        run: just check-publishable-separately --no-default-features
      - if: steps.run-job.outcome == 'success'
        run: just check-publishable-separately --all-features
  openapi_spec:
    name: "OpenAPI Spec"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e797ba6a25dbd8669057e123b02812e16138589e
        with:
          tool: just
      - run: just openapi-spec
