name: Book

on:
  push:
    branches:
    - master
  pull_request:
    paths:
    - 'docs/**'
    - '.github/workflows/book.yml'

jobs:
  book:
    name: Book
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: '0.4.21'
    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      with:
        persist-credentials: false
    - name: Install mdbook
      run: |
        curl -L https://github.com/rust-lang/mdBook/releases/download/v$MDBOOK_VERSION/mdbook-v$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz | tar xz -C ~/.cargo/bin
    # cspell:ignore katex
    - name: Install mdbook-katex
      run: |
        curl -L https://github.com/lzanini/mdbook-katex/releases/download/0.9.3-binaries/mdbook-katex-v0.9.3-x86_64-unknown-linux-gnu.tar.gz | tar xz -C ~/.cargo/bin
    - name: Build
      run: mdbook build
      working-directory: docs
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: book
        path: target/book
        overwrite: true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: book
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: book
    # cspell:disable-next-line
    - uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: .
