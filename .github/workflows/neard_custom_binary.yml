name: Build and publish custom neard binary

on:
  workflow_dispatch:
    inputs:
      branch:
        default: 'master'
        description: "Nearcore branch to build and publish"
        type: string
        required: true
      release-type:
        default: 'release'
        description: "Release type, see binary_release.sh for more details"
        type: choice
        options:
          - release
          - nightly-release
          - assertions-release
          - test-features-release
          - spice-release
        required: true
      with-debug-info:
        default: false
        description: "Build and upload split DWARF debug symbols (.debug sibling file)"
        type: boolean
        required: false

jobs:
  binary-release:
    name: "Build and publish neard binary"
    runs-on: warp-ubuntu-2404-x64-16x
    permissions:
      contents: read
      id-token: write # required to use OIDC authentication

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::590184106962:role/GitHubActionsRunner
          aws-region: us-west-1

      - name: Checkout workflow repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-clang

      - name: Checkout ${{ github.event.inputs.branch }} branch
        if: ${{ github.event_name == 'workflow_dispatch'}}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.branch }}
          persist-credentials: false

      - name: Neard binary build and upload to S3
        env:
          WITH_DEBUG_INFO: ${{ inputs.with-debug-info && '1' || '' }}
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: ./scripts/binary_release.sh "$RELEASE_TYPE"
