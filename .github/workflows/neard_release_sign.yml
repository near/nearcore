name: Sign published neard release binaries

# cspell:ignore cosign sigstore tolower

# Backfill for releases published before neard_release.yml started signing:
# downloads the Linux binaries of an existing release from S3, signs them with
# Sigstore keyless signing and uploads the .sigstore.json bundles next to them.
#
# The binaries are signed as they are in S3 today, not rebuilt, so these
# signatures carry this workflow's identity instead of neard_release.yml's.
# Verify with:
#   cosign verify-blob <file> --bundle <file>.sigstore.json \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity https://github.com/near/nearcore/.github/workflows/neard_release_sign.yml@refs/heads/master

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release or rc tag to sign, e.g. 2.14.0 or 2.14.0-rc.7"
        type: string
        required: true

jobs:
  sign:
    name: "Sign Linux binaries of ${{ inputs.tag }}"
    # The signing identity includes the ref the workflow runs from, so only
    # master is allowed.
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    environment: deploy
    permissions:
      id-token: write # required to use OIDC authentication
      contents: read

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::590184106962:role/GitHubActionsRunner
          aws-region: us-west-1

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign release binaries and upload signatures to S3
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "'${TAG}' is not a release or rc tag" >&2
            exit 1
          fi
          # Fails for tags without a published GitHub release (drafts included).
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .html_url
          commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)

          base_url="https://s3-us-west-1.amazonaws.com/build.nearprotocol.com/nearcore"
          bucket="s3://build.nearprotocol.com/nearcore"
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"

          # Prints the ETag of a public S3 object, or nothing if it does not exist.
          function etag {
            curl -sSI "$1" | tr -d '\r' | awk 'tolower($1) == "etag:" { print $2 }'
          }

          found=0
          for os_and_arch in Linux-x86_64 Linux-aarch64; do
            # Same layout as upload_release_binary in scripts/binary_release.sh.
            prefixes=(
              "${os_and_arch}/${TAG}"
              "${os_and_arch}/${TAG}/${commit}"
              "${os_and_arch}/${TAG}/${commit}/stable"
            )
            for file in neard neard.tar.gz neard.debug near-sandbox near-sandbox.tar.gz near-sandbox.debug; do
              path="${prefixes[0]}/${file}"
              file_etag=$(etag "${base_url}/${path}")
              if [ -z "${file_etag}" ]; then
                echo "${path} is not published, skipping"
                continue
              fi
              found=$((found + 1))
              # Never replace a signature, in particular one made by neard_release.yml.
              if [ -n "$(etag "${base_url}/${path}.sigstore.json")" ]; then
                echo "${path} is already signed, skipping"
                continue
              fi

              workdir=$(mktemp -d)
              curl -fsSL --retry 3 -o "${workdir}/${file}" "${base_url}/${path}"
              cosign sign-blob --yes --bundle "${workdir}/${file}.sigstore.json" "${workdir}/${file}"
              cosign verify-blob "${workdir}/${file}" --bundle "${workdir}/${file}.sigstore.json" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                --certificate-identity "${identity}"

              # The signature is only valid for copies identical to the signed file.
              for prefix in "${prefixes[@]}"; do
                if [ "$(etag "${base_url}/${prefix}/${file}")" = "${file_etag}" ]; then
                  aws s3 cp --acl public-read "${workdir}/${file}.sigstore.json" "${bucket}/${prefix}/${file}.sigstore.json"
                else
                  echo "::warning::${prefix}/${file} is missing or differs from ${path}, not signed"
                fi
              done
              rm -rf "${workdir}"
            done
          done

          if [ "${found}" -eq 0 ]; then
            echo "No Linux binaries found in S3 for ${TAG}" >&2
            exit 1
          fi
