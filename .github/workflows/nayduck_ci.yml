name: CI Nayduck tests
on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      neard-branch:
        default: "master"
        description: "nearcore git reference to test (branch-name or `refs/pull/$PR_NUMBER/head` or a commit hash)"
        type: string
        required: true

env:
  CI_HACKS: 1

jobs:
  nayduck_tests:
    name: "Run Nayduck CI tests"
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 60
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'


    steps:
      - name: Install JQ json processor
        run: sudo apt install jq

      - name: Checkout nearcore repository
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Checkout nearcore repository for workflow dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{github.event.inputs.neard-branch}}
          persist-credentials: false

      - name: Install required python modules
        run: |
          pip3 install -r ./pytest/requirements.txt

      - name: Create nayduck-code file
        run: |
          echo ${{ secrets.NAYDUCK_CODE }} > ~/.config/nayduck-code

      - name: Run Nayduck tests and wait for results
        id: nayduck_run
        run: |
          # Nayduck fails some of the requests when a few of them arrive at the
          # same time, which is what a merge queue does, so retry. The random
          # part of the delay keeps the jobs of other merge groups from
          # retrying in the same second.
          for ATTEMPT in 1 2 3 4; do
            # With stdin closed the script fails rather than waits for a new
            # authorization code if Nayduck rejects the current one.
            NEW_TEST=$(python3 ./scripts/nayduck.py --test-file nightly/ci.txt < /dev/null 2>&1) || true
            echo "$NEW_TEST"
            RUN_ID=$(grep -oE '#/run/[0-9]+' <<< "$NEW_TEST" | grep -oE '[0-9]+' | tail -n 1) || true
            if [ -n "$RUN_ID" ] || [ "$ATTEMPT" = 4 ]; then break; fi
            DELAY=$((ATTEMPT * 30 + RANDOM % 30))
            echo "Nayduck did not return a run id. Retrying in $DELAY seconds."
            sleep "$DELAY"
          done
          echo "nayduck_run_id=$RUN_ID" >> $GITHUB_OUTPUT
          if [ -z "$RUN_ID" ]; then
            echo "::error::Failed to schedule the Nayduck run; see the output above."
            exit 1
          fi

          sleep 10

          # wait all the tests to finish
          while true; do
            TEST_RESULTS=$(curl -s --max-time 30 https://nayduck.nearone.org/api/run/$RUN_ID) || true
            # Nayduck may be briefly unavailable and the response is then not
            # the JSON of the run. Try again; the job timeout bounds the wait.
            if ! jq -e '.tests | length > 0' <<< "$TEST_RESULTS" > /dev/null 2>&1; then
              echo "Could not get the status of the run. Sleeping 1 minute..."
              sleep 60
              continue
            fi
            TESTS_FAILED=$(jq '.tests | .[] | select(.status == "FAILED") ' <<< "$TEST_RESULTS" )
            if [ -n "$TESTS_FAILED" ]; then break; fi
            TESTS_NOT_READY=$(jq '.tests | .[] | select(.status == "RUNNING" or .status == "PENDING") ' <<< "$TEST_RESULTS" )
            if [ -z "$TESTS_NOT_READY" ]; then break; fi
            echo "Tests are not ready yet. Sleeping 1 minute..."
            sleep 60
          done

          UNSUCCESSFUL_TESTS=$(jq -r '.tests | .[] | select(.status != "PASSED" and .status != "IGNORED") | "\(.status): \(.name)"' <<< "$TEST_RESULTS" )
          if [ -z "$UNSUCCESSFUL_TESTS" ]; then
            echo "Nayduck CI tests passed."
            echo "Results available at https://nayduck.nearone.org/#/run/$RUN_ID"
          else
            echo "CI Nayduck tests are failing https://nayduck.nearone.org/#/run/$RUN_ID."
            echo "Failed tests:"
            echo "$UNSUCCESSFUL_TESTS"
            echo "Fix them before merging"
            exit 1
          fi

      - name: Cleanup Nayduck tests on cancel
        if: cancelled()
        run: |
          python3 ./scripts/nayduck.py -c ${STEPS_NAYDUCK_RUN_OUTPUTS_NAYDUCK_RUN_ID}
        env:
          STEPS_NAYDUCK_RUN_OUTPUTS_NAYDUCK_RUN_ID: ${{ steps.nayduck_run.outputs.nayduck_run_id }}

  pytest_tests:
    name: "Large pytest Tests"
    runs-on: warp-ubuntu-2404-x64-8x
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: gcp-auth
        name: Authenticate with Google Cloud
        continue-on-error: true
        uses: "google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed" # v2.1.13
        with:
          workload_identity_provider: "projects/60246494556/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "sccache-sa@nearone-services.iam.gserviceaccount.com"
      - if: steps.gcp-auth.outcome == 'success'
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
      - if: steps.gcp-auth.outcome == 'success'
        run: |
          echo "SCCACHE_GCS_BUCKET=nearone-sccache" >> $GITHUB_ENV
          echo "SCCACHE_GCS_RW_MODE=READ_WRITE" >> $GITHUB_ENV
          echo "SCCACHE_GCS_KEY_PREFIX=nearcore/ci" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
      - uses: WarpBuilds/setup-python@6cfa838faedb1152a7dc8626f00fdc041d8ebd82 # v5.1.4
        with:
          python-version: 3.11
          cache: pip
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov
      - run: pip3 install --user -r pytest/requirements.txt
      - run: cargo llvm-cov show-env --no-rustc-wrapper | grep -v RUSTFLAGS | tr -d "'" >> "$GITHUB_ENV"
      - run: echo "RUSTC_WORKSPACE_WRAPPER=$PWD/scripts/coverage-wrapper-rustc" >> "$GITHUB_ENV"
      - run: echo "CARGO=1" >> "$GITHUB_ENV"
      - uses: ./.github/actions/install-clang
      - run: cargo build --locked --profile dev-release -p neard --bin neard
      - run: echo "CURRENT_NEARD=$PWD/target/dev-release/neard" >> "$GITHUB_ENV"
      - run: echo "NEAR_ROOT=$PWD" >> "$GITHUB_ENV"
      - run: pushd pytest && python3 tests/sanity/upgradable.py && popd
      - run: pushd pytest && python3 tests/sanity/db_migration.py && popd
      - run: pushd pytest && python3 tests/sanity/backward_compatible.py && popd