version: v1
breaking:
  use:
    - WIRE
  ignore_only:
    # PeerMessage fields 29 and 30 were reserved in #16482 and reused in #16607
    # before any release shipped the reservation. Remove once #16607 is merged.
    RESERVED_MESSAGE_NO_DELETE:
      - chain/network/src/network_protocol/network.proto
lint:
  use:
    - DEFAULT
  ignore_only:
    # network.proto predates both rules. Renaming the package fails the WIRE
    # breaking check; matching the directory means moving the file out of the
    # crate that owns it.
    PACKAGE_DIRECTORY_MATCH:
      - chain/network/src/network_protocol/network.proto
    PACKAGE_VERSION_SUFFIX:
      - chain/network/src/network_protocol/network.proto
