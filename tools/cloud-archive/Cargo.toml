[package]
name = "near-cloud-archive-tool"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tracing.workspace = true

parking_lot.workspace = true

near-async.workspace = true
near-chain.workspace = true
near-client.workspace = true
near-epoch-manager.workspace = true
near-jsonrpc.workspace = true
near-jsonrpc-primitives.workspace = true

nearcore.workspace = true
near-chain-configs.workspace = true
near-primitives.workspace = true
near-store.workspace = true

[features]
# `near_jsonrpc::start_http` takes an extra argument under this feature, and the cfg is
# evaluated where the call is written, so it has to be reachable from here.
test_features = ["near-jsonrpc/test_features", "nearcore/test_features"]
