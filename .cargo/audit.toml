[advisories]
ignore = [
    # DO NOT ADD ANYTHING TO THIS LIST WITHOUT CAREFUL CONSIDERATION!

    # The instant package is unmaintained, but hard to replace right now because
    # parking_lot 0.11 depends on it (via reed-solomon-erasure).
    "RUSTSEC-2024-0384",

    # The derivative package is unmaintained, but hard to replace right now
    # because ark-ec depends on it.
    "RUSTSEC-2024-0388",

    # burntsushi says the crate is feature complete and needs no maintenance, nagisa also doesn't
    # see any security risk whatsoever to keeping this crate, so we'll be letting it to upgrade out
    # of existence naturally.
    "RUSTSEC-2024-0436",

    # libsecp256k1 is unmaintained, but every version of aurora-engine-transactions pulls it in
    # (via aurora-engine-precompiles in 1.1, or aurora-engine-sdk in 1.2+). In the main workspace
    # it's only a dev-dependency (test-loop-tests, integration-tests).
    "RUSTSEC-2025-0161",

    # RUSTSEC-2026-0097: rand unsoundness only triggers when rand's `log` feature is on and a
    # custom `log::Log` logger calls `rand::rng()` on reseed. Neither applies here: the `log`
    # feature is not enabled (check with `cargo tree -e features --workspace | grep 'rand feature'`)
    # and nearcore has no custom `log::Log` impl (logging goes through tracing).
    # Fixed in rand >= 0.8.6 / >= 0.9.3 / >= 0.10.1; our 0.8.5 is workspace-bumpable, but 0.9.0
    # is transitive (object_store/opentelemetry) and can't be forced. Non-triggering either way.
    "RUSTSEC-2026-0097",

    # RUSTSEC-2026-0194 / RUSTSEC-2026-0195: quick-xml DoS (quadratic parsing) fixed in >=0.41.0.
    # Only reachable transitively via rust-s3 / aws-creds / object_store, none of which have
    # released a version that uses quick-xml 0.41 yet. quick-xml here only parses trusted
    # S3/cloud-storage XML responses, not untrusted input. Remove once the upstream S3 crates upgrade.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # RUSTSEC-2026-0253: lru `pop()` leaves dangling list pointers if the key's
    # `Drop` panics, fixed in >= 0.18.2. The workspace dependency is bumped. The
    # copy left is lru 0.7.8 under reed-solomon-erasure, which requires `^0.7.8`
    # in its latest release, 6.0.0 (2022-09-23). Not triggerable there anyway:
    # the bug needs unwinding plus a key with a panicking `Drop`, and that cache
    # is keyed by `Vec<usize>` (reed-solomon-erasure `src/core.rs:349`).
    "RUSTSEC-2026-0253",

    # Wasmtime advisories.
    #
    # Nearcore is pinned to wasmtime 45.0.0 (see root Cargo.toml) with only the
    # `cranelift` and `winch` features. Clearing these advisories requires a
    # major wasmtime bump (fixes land in 48.x / 49.x), which is a protocol
    # change for us: the compiled contract artifacts and gas accounting depend
    # on the embedded wasmtime version, so the upgrade needs a dedicated
    # migration effort. Until that happens we ignore each advisory individually
    # after confirming the vulnerable code path is not reachable from how
    # nearcore embeds wasmtime.
    #
    # RUSTSEC-2026-0222: only affects embedders that mix objects from one
    # Engine into a Store belonging to another Engine. Nearcore never mixes
    # Engine-owned objects.
    "RUSTSEC-2026-0222",
    # RUSTSEC-2026-0269: sandbox escape in Wasmtime's WASI filesystem
    # implementation. Nearcore uses Wasmtime to execute contracts with its own
    # host functions and does not enable or link Wasmtime's WASI support.
    "RUSTSEC-2026-0269",
    # RUSTSEC-2026-0316: Nearcore doesn't use fuel limits, this doesn't affect us.
    "RUSTSEC-2026-0316",
    # RUSTSEC-2026-0327: Nearcore doesn't use component-model-async, this doesn't affect us.
    "RUSTSEC-2026-0327",
    # RUSTSEC-2026-0359: stack overflow in Wasmtime's type-registry drop path,
    # triggered by a long chain of recursively-referencing types. Only reachable
    # with the GC or function-references proposals (or component types); nearcore
    # disables both (`GC = false`, `FUNCTION_REFERENCES = false` in
    # `runtime/near-vm-runner/src/features.rs`) and does not use the component
    # model, so registered core-wasm func types are flat.
    "RUSTSEC-2026-0359",
    # RUSTSEC-2026-0362: async-entrypoint enforcement bug. The advisory
    # explicitly states embedders that don't use async at all are unaffected;
    # nearcore uses only sync Wasmtime APIs.
    "RUSTSEC-2026-0362",
    # RUSTSEC-2026-0363: unbounded per-instance component-model handle table.
    # Nearcore builds Wasmtime without the component model, so the handle-table
    # code path isn't compiled in.
    "RUSTSEC-2026-0363",

    # RUSTSEC-2024-0449: unsafe-libyaml is unmaintained. Reached only through
    # serde_yaml (itself marked deprecated upstream; latest is 0.9.34+deprecated),
    # used by near-parameters to parse trusted in-tree runtime parameter files, not
    # untrusted input. Remove once near-parameters moves off serde_yaml (#16566).
    "RUSTSEC-2024-0449",

    # RUSTSEC-2026-0367 / RUSTSEC-2026-0368 / RUSTSEC-2026-0369: `zip` crate
    # ZipArchive::extract vulnerabilities (SUID/SGID preservation, symlink
    # target escape, Unix permissions applied through symlinks). Fixed in
    # zip >= 9.0.0. Reached only via utoipa-swagger-ui 9.0.2 (used by
    # near-rosetta-rpc to serve the Swagger UI at /swagger-ui). The `vendored`
    # feature uses `zip` only at build time to unpack a trusted Swagger-UI
    # release archive shipped with the crate into OUT_DIR -- no runtime
    # extraction of attacker-controlled zips. Latest published
    # utoipa-swagger-ui 10.0.1 still pins zip = "8.6"; remove these once
    # upstream releases a version with zip >= 9.0.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
