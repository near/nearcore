max_globals_per_contract: { new: 65_536 }
fix_contract_loading_cost: { old: false, new: true }
per_receipt_storage_proof_size_limit: { old: 4_000_000, new: 4_500_000 }
fix_register_input_charging: { old: false, new: true }
bls12381_not_in_group_fix: { old: false, new: true }

# Gas keys have been live since protocol 85, so the base values stay unlimited.
# 1_024 matches `MAX_NONCES_FOR_GAS_KEY`: one gas key with max nonces per receipt.
max_gas_key_nonces_added_per_receipt: { old: 4_294_967_295, new: 1_024 }
max_gas_key_nonces_removed_per_receipt: { old: 4_294_967_295, new: 1_024 }

max_gas_burnt_external: { old: 0, new: 20_000_000_000_000 }

# Limits on external contract calls, which nobody pays for when the contract refuses them.
# Per call: the size of the call and the storage proof its run records, 20 KiB each.
max_external_call_size: { old: 0, new: 20_480 }
max_external_call_recorded_size: { old: 0, new: 20_480 }
# Per chunk, for all external calls together: shares of the chunk's limits, each of which fits
# five calls at the per-call limits (see `test_external_calls_shares_fit_five_worst_case_calls`).
# 40% of the chunk's compute limit.
external_calls_chunk_compute_share:
  {
    old: { numerator: 0, denominator: 1 },
    new: { numerator: 2, denominator: 5 },
  }
# 5% of `main_storage_proof_size_soft_limit`.
external_calls_chunk_storage_proof_share:
  {
    old: { numerator: 0, denominator: 1 },
    new: { numerator: 1, denominator: 20 },
  }
# 2.5% of `combined_transactions_size_limit`.
external_calls_chunk_transactions_size_share:
  {
    old: { numerator: 0, denominator: 1 },
    new: { numerator: 1, denominator: 40 },
  }
# At most 100 external calls in a chunk, however small they are.
max_external_calls_per_chunk: { old: 0, new: 100 }
