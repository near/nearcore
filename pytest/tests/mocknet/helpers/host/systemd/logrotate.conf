# Rotates the neard log at 200M and compresses the rotated files. Keeps any
# number of rotated files, but before each rotation deletes the oldest ones
# until all neard logs fit in the root disk size minus 50G.
# cspell:ignore copytruncate missingok notifempty dateext delaycompress dateformat prerotate endscript
/home/ubuntu/neard-logs/logs.txt {
    size 200M
    rotate 100000
    copytruncate
    missingok
    notifempty
    dateext
    dateformat -%Y-%m-%d-%H-%M-%S
    compress
    delaycompress
    prerotate
        max_size=$(( $(df -B1 --output=size / | tail -n1) - 50 * 1024 * 1024 * 1024 ))
        while [ "$(du -cb /home/ubuntu/neard-logs/logs.txt* | tail -n1 | cut -f1)" -gt "$max_size" ]; do
            oldest=$(ls -1 /home/ubuntu/neard-logs/logs.txt-* 2>/dev/null | head -n1)
            [ -n "$oldest" ] || break
            rm -f "$oldest"
        done
    endscript
}
