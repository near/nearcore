# Keeps 20 rotated neard logs of 200M each, compressed.
# cspell:ignore copytruncate missingok notifempty dateext delaycompress dateformat
/home/ubuntu/neard-logs/logs.txt {
    size 200M
    rotate 20
    copytruncate
    missingok
    notifempty
    dateext
    dateformat -%Y-%m-%d-%H-%M-%S
    compress
    delaycompress
}
