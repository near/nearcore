[package]
name = "near-wallet-contract"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Builds and exposes Wallet Contract code."
repository.workspace = true
license.workspace = true
publish = true
# The contract source in `implementation/` is a copy of near/near-wallet-contract;
# only the prebuilt wasm files are published.
include = ["src/**", "res/*.wasm", "build.rs", "README.md", "LICENSE-*"]

[lints]
workspace = true

[dependencies]
near-primitives-core.workspace = true
near-vm-runner.workspace = true

[build-dependencies]
anyhow.workspace = true

[features]
nightly = [
  "near-primitives-core/nightly",
  "near-vm-runner/nightly",
]
