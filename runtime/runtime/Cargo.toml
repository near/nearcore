[package]
name = "near-runtime"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Transaction and receipt processing runtime of the NEAR node"
repository.workspace = true
license.workspace = true
publish = true

[lib]
name = "node_runtime"

[lints]
workspace = true

[dependencies]
base64 = { workspace = true, optional = true }
borsh.workspace = true
bytesize.workspace = true
ahash.workspace = true
dashmap.workspace = true
itertools.workspace = true
parking_lot.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rayon.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

near-async.workspace = true
near-crypto.workspace = true
near-o11y.workspace = true
near-parameters.workspace = true
near-primitives.workspace = true
near-primitives-core.workspace = true
# Declared directly rather than via `workspace = true` so near-runtime can opt
# out of near-store's default `rocksdb`/`cloud_archive` features: the runtime
# only needs the trie/store APIs, and embedders using the in-memory store
# should not have to build RocksDB. Keep this on one line: cargo-workspaces
# adds the `version` to it at publish time.
near-store = { path = "../../core/store", default-features = false }
near-vm-runner = { workspace = true, features = ["wasmtime_vm"] }
near-wallet-contract.workspace = true

[features]
default = []
estimator = ["near-primitives/test_utils"]
io_trace = ["base64"]
nightly = [
    "near-chain-configs/nightly",
    "near-o11y/nightly",
    "near-parameters/nightly",
    "near-primitives-core/nightly",
    "near-primitives/nightly",
    "near-store/nightly",
    "near-vm-runner/nightly",
    "near-wallet-contract/nightly",
    "testlib/nightly",
]
sandbox = ["near-o11y/sandbox", "near-vm-runner/sandbox"]
test_features = [
    "near-primitives/test_features",
    "near-vm-runner/test_features",
    "near-store/test_features",
]

[dev-dependencies]
assert_matches.workspace = true
enum-map.workspace = true
hex.workspace = true
tempfile.workspace = true
expect-test.workspace = true

near-chain-configs.workspace = true
near-store = { workspace = true, features = ["test_features"] }
near-test-contracts.workspace = true
testlib.workspace = true
